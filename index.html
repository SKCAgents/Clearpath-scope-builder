<script type="text/babel">
/**
 * index.html — Core scope builder UI (App component) and document renderer
 *
 * This inline script contains the main App component that powers the scope
 * builder interface — the two-panel layout with the section library on the
 * left and the document preview on the right.
 *
 * It is rendered inside ProjectEditor (from app.jsx), which wraps it with
 * database connectivity and auto-save. App itself is "dumb" — it just manages
 * local UI state and calls onChange() whenever anything changes.
 *
 * Key responsibilities:
 *   - Merging the hardcoded scope library with any database additions
 *   - Managing the section list, exclusions, allowances, and project info
 *   - Rendering the build view (editor) and preview view (document)
 *   - Wiring up PDF export and .docx download
 */


// ── State initialization helpers ──────────────────────────────────────────────

// Builds the initial sections array by merging the hardcoded SCOPE_LIBRARY
// (from ScopeLibrary.jsx) with the user-editable library stored in the
// database (libraryData.sections).
//
// Merge rule: if a section has a DB row, that row's items REPLACE the
// hardcoded items for that section. Otherwise the hardcoded items are used.
// This lets edits to hardcoded sections persist (via snapshot-on-first-edit
// in cpUpdateLibraryItem / cpAddToLibrary).
//
// Each item carries a libraryText field — the text as it currently exists in
// the library — so that when a user edits an item locally and later clicks
// "Save to Library", we know which library entry to replace.
// All items start unchecked — the user selects what applies to their project.
// projectType selects a PROJECT_TEMPLATES entry (see ScopeLibrary.jsx). The
// template decides which sections start switched on:
//
//   section in the template     → its lines start checked. If the master
//                                 template marks specific lines as pre-selected
//                                 for that section, only those get checked;
//                                 otherwise all of them do.
//   section not in the template  → nothing checked, but the section is still
//                                 there to check by hand.
//   no project type chosen      → the original behaviour: master template
//                                 pre-selections only.
function initSections(libraryData, projectType) {
  // Settings rows (ids prefixed '__', e.g. the allowance defaults) share the
  // library_sections table but are not scope sections — skip them.
  const dbSections = (libraryData?.sections || []).filter(s => !String(s.id).startsWith('__'));
  const dbById = {};
  dbSections.forEach(s => { dbById[s.id] = s; });

  const tmpl = typeof templateFor === 'function' ? templateFor(projectType) : null;
  const templateSections = tmpl ? new Set(tmpl.sections) : null;

  // How a section's lines start out. 'master' = follow the master template's
  // pre-selections, 'all' = everything checked, 'none' = nothing checked.
  const inclusionMode = (sectionId, includedSet) => {
    if (!templateSections) return 'master';
    if (!templateSections.has(sectionId)) return 'none';
    return includedSet.size ? 'master' : 'all';
  };

  // includedSet — the texts the master template marks as pre-checked for this
  // section (from the DB row's included_items).
  const toItem = (sectionId, includedSet, mode) => (text, i) => {
    const str = typeof text === 'string' ? text : String(text);
    return {
      id:          sectionId + '_' + i,
      text:        str,
      libraryText: str,   // Original text in the library — used by "Save to Library" to identify which entry to replace
      included:    mode === 'all' ? true : mode === 'none' ? false : includedSet.has(str),
      custom:      false, // Custom = added at the project level (not from the library)
    };
  };

  // Hardcoded sections, with DB row (if present) replacing the items list
  const merged = SCOPE_LIBRARY.map(s => {
    const db = dbById[s.id];
    const items = db ? db.items : (s.items || []);
    const includedSet = new Set(db?.included_items || []);  // built-ins with no DB row: nothing pre-checked
    return {
      id: s.id,
      title: db?.title || s.title,
      defaultOpen: false,
      items: items.map(toItem(s.id, includedSet, inclusionMode(s.id, includedSet))),
    };
  });

  // Plus user-created sections that live only in the DB (no hardcoded match)
  const hardcodedIds = new Set(SCOPE_LIBRARY.map(s => s.id));
  const dbOnly = dbSections
    .filter(s => !hardcodedIds.has(s.id))
    .map(s => {
      const includedSet = new Set(s.included_items || []);
      return {
        id: s.id,
        title: s.title,
        defaultOpen: false,
        items: (s.items || []).map(toItem(s.id, includedSet, inclusionMode(s.id, includedSet))),
      };
    });

  // Ordering mirrors the Master Template editor (buildTemplateView in app.jsx):
  // once every built-in section has its own DB row, the user has set a full
  // custom order (sequential sort_order across all sections), so the whole list
  // sorts by sort_order. Until then, keep the default order — built-ins in their
  // hardcoded order, then custom sections by sort_order.
  const masterOrder = SCOPE_LIBRARY.every(s => dbById[s.id]);
  const orderOf = id => (dbById[id]?.sort_order ?? 999);
  if (masterOrder) {
    return [...merged, ...dbOnly].sort((a, b) => orderOf(a.id) - orderOf(b.id));
  }
  return [...merged, ...dbOnly.sort((a, b) => orderOf(a.id) - orderOf(b.id))];
}

// Builds the initial exclusions array. If the database has custom exclusions,
// use those; otherwise fall back to the hardcoded EXCLUSION_LIBRARY defaults.
function initExclusions(libraryData) {
  const src = (libraryData?.exclusions?.length)
    ? libraryData.exclusions.map(e => e.text)
    : EXCLUSION_LIBRARY;
  return src.map((text, i) => ({ id: 'excl_' + i, text, included: false }));
}

// Looks up the hardcoded items for a section by id. Used when pushing edits
// to the library so the DB row can be seeded with the section's original
// contents on first save (so other items in that section don't disappear).
function getHardcodedItems(sectionId) {
  const sec = (window.SCOPE_LIBRARY || []).find(s => s.id === sectionId);
  return sec ? (sec.items || []) : [];
}

// Backfill libraryText on items loaded from older project saves that didn't
// store it. Assumes any item without libraryText reflects its original
// library text (i.e. unedited locally), which is true for the vast majority
// of cases. Without this, "Save to Library" on an old-format item would
// fall back to "append" semantics and duplicate the library entry.
function backfillLibraryText(loadedSections) {
  return (loadedSections || []).map(s => ({
    ...s,
    items: (s.items || []).map(item => ({
      ...item,
      libraryText: item.libraryText !== undefined ? item.libraryText : item.text,
    })),
  }));
}


// Rebuilds the section list for a different project type, keeping the work the
// user has already done that the template can't know about:
//   - lines they added to a library section themselves (item.custom) are
//     re-appended to that section
//   - whole sections they created in this project (not in the library at all)
//     are kept as-is at the end
// Everything else — which library lines are checked — comes from the new
// template, which is the point of switching.
function applyTemplate(prevSections, libraryData, projectType) {
  const fresh = initSections(libraryData, projectType);
  const freshIds = new Set(fresh.map(s => s.id));
  const prev = prevSections || [];

  const rebuilt = fresh.map(s => {
    const before = prev.find(p => p.id === s.id);
    if (!before) return s;
    const customs = (before.items || []).filter(i => i.custom);
    return customs.length ? { ...s, items: [...s.items, ...customs] } : s;
  });

  return [...rebuilt, ...prev.filter(p => !freshIds.has(p.id))];
}


// ── Scope snapshots (templates) ───────────────────────────────────────────────
// A template is a named scope snapshot. These three functions are the only
// place that decides what a snapshot contains, and they're used by the
// Templates screens in app.jsx as well as by App itself.
//
// A snapshot holds the scope: the sections with their check marks, the
// exclusions, the allowances, the add-ons, and the scope-shaped parts of info
// (project type and the two durations). It deliberately does NOT hold the
// client, address, prepared date, description, price or deposit — those belong
// to a project. Uploaded design drawings are left out too: they're photos of
// one job's plans, not reusable scope.

// The fields of `info` a template carries.
const TEMPLATE_INFO_KEYS = ['projectType', 'designWeeks', 'constructionWeeks'];

// Pulls a snapshot out of a live editor state.
function scopeFromState(state) {
  const info = {};
  TEMPLATE_INFO_KEYS.forEach(k => {
    if (state?.info && state.info[k] !== undefined) info[k] = state.info[k];
  });
  return {
    info,
    sections:   state?.sections   || [],
    exclusions: state?.exclusions || [],
    allowances: state?.allowances || [],
    addOns:     state?.addOns     || [],
  };
}

// Turns a snapshot back into the initialState App expects. Deep-copied, because
// a template is a one-time copy: the new project must not share array or object
// references with the snapshot it came from.
function stateFromScope(scope, extraInfo) {
  const copy = JSON.parse(JSON.stringify(scope || {}));
  return {
    info:       { ...(copy.info || {}), ...(extraInfo || {}) },
    sections:   copy.sections   || [],
    exclusions: copy.exclusions || [],
    allowances: copy.allowances || [],
    addOns:     copy.addOns     || [],
  };
}

// The snapshot a brand-new template starts from: exactly what a new project
// gets when it starts from Master — every library section present with nothing
// checked, the standard exclusions, and the allowance checklist at its defaults.
function masterScope(libraryData) {
  return {
    info:       { projectType: '', designWeeks: CP_DEFAULT_DESIGN_WEEKS, constructionWeeks: CP_DEFAULT_CONSTRUCTION_WEEKS },
    sections:   initSections(libraryData, ''),
    exclusions: initExclusions(libraryData),
    allowances: initAllowances(libraryData),
    addOns:     [],
  };
}


// ── Default values ────────────────────────────────────────────────────────────

// The allowance checklist every project starts with — one entry per category in
// ALLOWANCE_CATEGORIES (ScopeLibrary.jsx), all unchecked, each carrying its
// default amount. The user checks the ones that apply and edits amounts per
// project; unchecked categories print as explicitly excluded.
//
// The list comes from the admin-set defaults in the library when they exist
// (cpParseAllowanceDefaults), otherwise from the ALLOWANCE_CATEGORIES seed.
//
// The admin list REPLACES the seed rather than being layered over it. That is
// what makes an admin deletion stick — layering would let a deleted category
// reappear from the seed on the next new project. It also means categories the
// admin adds flow through with no code change.
//
// Each category brings its own default amount and its own default checked
// state, both set in the admin card.
function initAllowances(libraryData) {
  const admin = typeof window.cpParseAllowanceDefaults === 'function'
    ? window.cpParseAllowanceDefaults(libraryData)
    : null;

  const source = admin || (window.ALLOWANCE_CATEGORIES || []);

  return source.map(c => ({
    id:       c.id || allowanceIdFor(c.label),
    label:    c.label,
    amount:   c.amount || '$ 0',
    included: !!c.included,
  }));
}

// A stable id for a category that somehow has none (a hand-edited settings row).
// Derived from the label so the same category keeps the same id across reloads,
// which is what lets mergeAllowances match a saved project against it.
function allowanceIdFor(label) {
  return 'alw_' + String(label || '').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
}

// Reconciles a saved allowance list with the current category list.
//
// Projects saved before the checklist existed hold free-form rows the user
// typed by hand ({ label, amount } with no id and no included flag). Those are
// kept — dropping them would silently delete numbers from a live quote — and
// they stay included, since that is what they meant at the time. Any category
// missing from the saved list is appended unchecked with its default amount, so
// a project opened after a new category is added shows the full checklist.
function mergeAllowances(saved, libraryData) {
  const defaults = initAllowances(libraryData);
  const savedList = saved || [];

  const matched = new Set();
  const merged = defaults.map(d => {
    const hit = savedList.find(s =>
      (s.id && s.id === d.id) || (s.label || '').trim().toLowerCase() === d.label.toLowerCase()
    );
    if (!hit) return d;
    matched.add(hit);
    return {
      id: d.id,
      label: d.label,
      amount: hit.amount !== undefined && hit.amount !== '' ? hit.amount : d.amount,
      // A legacy row has no `included` field; it was on the document, so it
      // stays on. Only an explicit false means the user unchecked it.
      included: hit.included !== undefined ? !!hit.included : true,
    };
  });

  // Anything left over is either an allowance typed by hand in an older version
  // of the app, or a category the admin has since deleted from the master list.
  // Either way this project still quotes it, so it stays — flagged `custom` so
  // the editor offers a remove button for it (fixed categories are excluded by
  // unchecking, not deleting).
  const extras = savedList
    .filter(s => !matched.has(s))
    .map(s => ({ ...s, custom: true, included: s.included !== undefined ? !!s.included : true }));

  return [...merged, ...extras];
}

// Default project info fields. preparedBy is pre-filled; everything else is blank.
//
// estimate is a single price — the document prints it as a ±10% range and never
// prints this figure itself (see cpPriceRange in ScopeSchedule.js). The old
// estimateLow / estimateHigh fields are gone.
//
// The schedule is derived from these two durations plus the date the scope is
// generated, so there are no start/end date fields either.
const DEFAULT_INFO = {
  projectName: '', clientName: '', address: '', date: '',
  preparedBy:  'ClearPath Construction',
  projectType: '',
  estimate: '',
  designStartDate: '',   // blank ⇒ derive the next Monday a week out
  designWeeks:       CP_DEFAULT_DESIGN_WEEKS,
  constructionWeeks: CP_DEFAULT_CONSTRUCTION_WEEKS,
  deposit: '$ 5,000', depositMemo: '',
};


// ── App component ─────────────────────────────────────────────────────────────
// The main scope builder UI. Accepts saved state from ProjectEditor (via
// initialState) and notifies it of changes (via onChange) so they can be
// auto-saved to the database.
//
// Props:
//   initialState — previously saved project data (null for a brand new project)
//   onChange     — called with the full current state whenever anything changes
//   libraryData  — scope library data fetched from the database
//   saveStatus   — 'saved' | 'saving' | 'pending' | 'error' (shown in the top bar)
//   onBack       — called when the user clicks "← Projects" to return to the list
// templateMode — set when App is editing a named scope template rather than a
// project: { name, onRename }. In that mode the document-specific chrome is
// hidden (no PDF/.docx export, no project info fields, no design drawings),
// since a template has no client, price or dates to print.
function App({ initialState, onChange, libraryData, saveStatus, onBack, templateMode, onSaveAsTemplate }) {
  const [tab, setTab] = React.useState('build');
  // Merge saved/seeded info over the defaults: a newly created project carries
  // the name/client/address entered in the New Project dialog, and any field it
  // doesn't specify (preparedBy, deposit, …) still picks up its default.
  const [info, setInfo] = React.useState({ ...DEFAULT_INFO, ...(initialState?.info || {}) });
  const [sections, setSections] = React.useState(() =>
    initialState?.sections
      ? backfillLibraryText(initialState.sections)
      // New project: the type picked in the New Project dialog decides which
      // sections start switched on.
      : initSections(libraryData, initialState?.info?.projectType)
  );
  const [exclusions, setExclusions] = React.useState(initialState?.exclusions || initExclusions(libraryData));
  const [allowances, setAllowances] = React.useState(() => mergeAllowances(initialState?.allowances, libraryData));
  const [addOns, setAddOns] = React.useState(initialState?.addOns || []);
  const [designDrawings, setDesignDrawings] = React.useState(initialState?.designDrawings || []);
  const [sideTab, setSideTab] = React.useState('sections');
  const [searchQ, setSearchQ] = React.useState('');

  // Notify parent of changes (auto-save handled by ProjectEditor)
  React.useEffect(() => {
    if (onChange) onChange({ info, sections, exclusions, allowances, addOns, designDrawings });
  }, [info, sections, exclusions, allowances, addOns, designDrawings]);

  // Render print frame when previewing
  React.useEffect(() => {
    if (tab === 'preview') {
      const frame = document.getElementById('print-frame');
      if (frame) {
        const docEl = document.getElementById('scope-document');
        if (docEl) frame.innerHTML = docEl.outerHTML;
      }
    }
  }, [tab, info, sections, exclusions, allowances]);

  function updateSectionItems(id, items) {
    setSections(sects => sects.map(s => s.id === id ? { ...s, items } : s));
  }

  // Changing the project type after creation reloads the scope template, which
  // throws away the current check marks — so confirm first. Custom lines and
  // custom sections survive (see applyTemplate).
  function changeProjectType(next) {
    if (next === (info.projectType || '')) return;
    const label = projectTypeLabel(next);
    const warning = label
      ? `Switch this project to the ${label} template?\n\nThe ${label} template decides which scope lines are checked, replacing your current selections. Lines and sections you added yourself are kept, as are allowances and project details.`
      : 'Clear the project type?\n\nAll scope lines will be unchecked. Lines and sections you added yourself are kept.';
    if (!window.confirm(warning)) return;
    setInfo(i => ({ ...i, projectType: next }));
    setSections(sects => applyTemplate(sects, libraryData, next));
  }

  function toggleAll(id) {
    setSections(sects => sects.map(s => {
      if (s.id !== id) return s;
      const allIncluded = s.items.every(i => i.included);
      return { ...s, items: s.items.map(i => ({ ...i, included: !allIncluded })) };
    }));
  }

  function moveSection(id, dir) {
    setSections(sects => {
      const idx = sects.findIndex(s => s.id === id);
      if (idx < 0) return sects;
      const newIdx = idx + dir;
      if (newIdx < 0 || newIdx >= sects.length) return sects;
      const arr = [...sects];
      [arr[idx], arr[newIdx]] = [arr[newIdx], arr[idx]];
      return arr;
    });
  }

  function deleteSection(id) {
    setSections(sects => sects.filter(s => s.id !== id));
  }

  function addSection(title) {
    const id = 'custom_' + Date.now();
    setSections(sects => [...sects, { id, title, defaultOpen: true, items: [] }]);
  }

  // Drag-to-reorder state
  const dragRef = React.useRef(null);
  const [dragOver, setDragOver] = React.useState(null);

  function onDragStart(id) { dragRef.current = id; }
  function onDragEnter(id) { setDragOver(id); }
  function onDragEnd() {
    if (dragRef.current && dragOver && dragRef.current !== dragOver) {
      setSections(sects => {
        const arr = [...sects];
        const fromIdx = arr.findIndex(s => s.id === dragRef.current);
        const toIdx = arr.findIndex(s => s.id === dragOver);
        if (fromIdx < 0 || toIdx < 0) return arr;
        const [item] = arr.splice(fromIdx, 1);
        arr.splice(toIdx, 0, item);
        return arr;
      });
    }
    dragRef.current = null;
    setDragOver(null);
  }

  const [addingSectionName, setAddingSectionName] = React.useState('');

  const totalIncluded = sections.reduce((n, s) => n + s.items.filter(i => i.included).length, 0);
  const totalExclusions = exclusions.filter(e => e.included).length;

  const filteredSections = searchQ
    ? sections.map(s => ({
        ...s,
        items: s.items.filter(i => i.text.toLowerCase().includes(searchQ.toLowerCase())),
        defaultOpen: true,
      })).filter(s => s.items.length > 0 || s.title.toLowerCase().includes(searchQ.toLowerCase()))
    : sections;

  // Save status label
  const saveLabel = saveStatus === 'saving' ? 'Saving…' : saveStatus === 'pending' ? 'Unsaved' : saveStatus === 'error' ? 'Save failed' : 'Saved';
  const saveColor = saveStatus === 'error' ? '#e07060' : saveStatus === 'saved' ? 'rgba(239,236,232,0.35)' : 'rgba(239,236,232,0.55)';

  // ── Top bar ──
  const topBar = React.createElement('div', {
    style: { background: C.slate, height: 52, display:'flex', alignItems:'center', padding:'0 20px', gap:16, flexShrink:0 }
  },
    // Back to projects
    onBack && React.createElement('button', {
      onClick: onBack,
      key: 'back',
      style: { fontFamily:"'Figtree',sans-serif", fontSize:10, letterSpacing:'0.12em', textTransform:'uppercase', fontWeight:400, background:'none', border:'none', cursor:'pointer', color:'rgba(239,236,232,0.55)', padding:'0 8px 0 0', display:'flex', alignItems:'center', gap:4 }
    }, templateMode ? '← Templates' : '← Projects'),
    onBack && React.createElement('div', { style:{ width:1, height:20, background:'rgba(239,236,232,0.15)' } }),
    // Which template is being edited, with rename in reach. Only in template mode.
    templateMode && React.createElement('div', { key:'tname', style:{ display:'flex', alignItems:'center', gap:8 } },
      React.createElement('span', { style:{ fontFamily:"'Figtree',sans-serif", fontSize:9, letterSpacing:'0.2em', textTransform:'uppercase', color:'rgba(239,236,232,0.45)' } }, 'Template'),
      React.createElement('span', { style:{ fontFamily:"'Cormorant Garamond',serif", fontSize:17, color:'#EFECE8' } }, templateMode.name),
      templateMode.onRename && React.createElement('button', {
        onClick: templateMode.onRename,
        style:{ fontFamily:"'Figtree',sans-serif", fontSize:9, letterSpacing:'0.12em', textTransform:'uppercase', background:'none', color:'rgba(239,236,232,0.55)', border:'1px solid rgba(239,236,232,0.25)', padding:'4px 8px', cursor:'pointer' }
      }, 'Rename')
    ),
    // Logo
    React.createElement('div', { style:{ display:'flex', alignItems:'center', gap:12 } },
      React.createElement('img', {
        src: (document.getElementById('__logo_icon')||{}).src || 'assets/ClearPath-Icon-Limestone.png',
        alt: 'ClearPath',
        style: { height: 32, width: 'auto', display: 'block' }
      }),
      React.createElement('div', { style:{ fontFamily:"'Figtree', sans-serif", fontSize:8, letterSpacing:'0.28em', textTransform:'uppercase', color:'#C3BDB1' } }, 'Scope Builder')
    ),
    // Save status
    saveStatus && React.createElement('div', {
      style: { fontFamily:"'Figtree',sans-serif", fontSize:9, letterSpacing:'0.12em', textTransform:'uppercase', color: saveColor }
    }, saveLabel),
    React.createElement('div', { style:{ flex:1 } }),
    // Tabs
    ...['build', 'preview'].map(t =>
      React.createElement('button', {
        key:t, onClick:()=>setTab(t),
        style:{
          fontFamily:"'Figtree',sans-serif", fontSize:10, letterSpacing:'0.15em', textTransform:'uppercase',
          fontWeight:500, background:'none', border:'none', cursor:'pointer',
          color: t===tab ? '#EFECE8' : 'rgba(239,236,232,0.45)',
          borderBottom: t===tab ? '1px solid #EFECE8' : '1px solid transparent',
          paddingBottom:2,
        }
      }, t === 'build' ? '← Build' : 'Preview →')
    ),
    React.createElement('div', { style:{ width:1, height:20, background:'rgba(239,236,232,0.2)' } }),
    // Exports are project-only: a template has no client, price or dates to print.
    !templateMode && React.createElement('button', {
      key: 'pdf',
      onClick: () => {
        setTab('preview');
        setTimeout(() => {
          const docEl = document.getElementById('scope-document');
          if (!docEl) { alert('Document not ready, try again.'); return; }

          const fontLinks = [...document.querySelectorAll('link[rel="stylesheet"], link[rel="preconnect"]')]
            .map(l => l.outerHTML).join('\n');
          const fontStyles = [...document.querySelectorAll('style')]
            .map(s => s.outerHTML).join('\n');

          const measuredPx = docEl.getBoundingClientRect().height;
          const heightIn = Math.ceil((measuredPx / 96) * 100) / 100 + 0.15;

          const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${(info.projectName||'Scope of Work').replace(/[<>"]/g,'')} — Scope of Work</title>
${fontLinks}
${fontStyles}
<style>
  html, body { margin:0; padding:0; background:white; }
  body { font-family: 'Figtree', sans-serif; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  @page { size: 8.5in ${heightIn}in; margin: 0; }
  @media print { body { width: 8.5in; } }
</style>
</head><body>${docEl.outerHTML}
<script>
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve())
    .then(() => setTimeout(() => { window.focus(); window.print(); }, 300));
  window.onafterprint = () => window.close();
<\/script>
</body></html>`;

          const w = window.open('', '_blank', 'width=900,height=1100');
          if (!w) { alert('Pop-up blocked. Please allow pop-ups for this site to export the PDF.'); return; }
          w.document.open();
          w.document.write(html);
          w.document.close();
        }, 400);
      },
      style:{ fontFamily:"'Figtree',sans-serif", fontSize:10, letterSpacing:'0.15em', textTransform:'uppercase', fontWeight:500, background:'#EFECE8', color:C.slate, border:'none', padding:'7px 16px', cursor:'pointer' }
    }, 'Export PDF'),
    !templateMode && React.createElement('button', {
      key: 'docx',
      onClick: async () => {
        try {
          await window.generateScopeDocx({ info, sections, exclusions, allowances, addOns, designDrawings });
        } catch (err) {
          console.error(err);
          alert('Could not generate .docx — check console for details.');
        }
      },
      title: 'Download as .docx — open in Google Docs to share/comment',
      style:{ fontFamily:"'Figtree',sans-serif", fontSize:10, letterSpacing:'0.15em', textTransform:'uppercase', fontWeight:500, background:'transparent', color:'#EFECE8', border:'1px solid rgba(239,236,232,0.4)', padding:'6px 14px', cursor:'pointer' }
    }, 'Download .docx'),
    // Turns the scope in front of you into a reusable named template. A
    // one-time copy — later edits to either side don't cross over.
    !templateMode && onSaveAsTemplate && React.createElement('button', {
      key: 'saveTmpl',
      onClick: () => onSaveAsTemplate(scopeFromState({ info, sections, exclusions, allowances, addOns })),
      title: 'Save this scope as a reusable template',
      style:{ fontFamily:"'Figtree',sans-serif", fontSize:10, letterSpacing:'0.15em', textTransform:'uppercase', fontWeight:400, background:'transparent', color:'#EFECE8', border:'1px solid rgba(239,236,232,0.4)', padding:'6px 14px', cursor:'pointer' }
    }, 'Save as Template'),
    React.createElement('button', {
      key: 'reset',
      onClick: () => { if (confirm('Reset everything to a blank scope?')) { setSections(initSections(libraryData, '')); setExclusions(initExclusions(libraryData)); setInfo(DEFAULT_INFO); setAllowances(initAllowances(libraryData)); setAddOns([]); } },
      style:{ fontFamily:"'Figtree',sans-serif", fontSize:10, letterSpacing:'0.15em', textTransform:'uppercase', fontWeight:400, background:'none', color:'rgba(239,236,232,0.4)', border:'1px solid rgba(239,236,232,0.2)', padding:'6px 12px', cursor:'pointer' }
    }, 'Reset')
  );

  // ── BUILD VIEW ──
  const buildView = React.createElement('div', { style:{ flex:1, overflow:'hidden', background:C.bgLight, display:'flex' } },
    React.createElement('div', { style:{ display:'flex', flex:1, overflow:'hidden', maxWidth:1240, margin:'0 auto', width:'100%' } },

    // Left sidebar — Project info + allowances
    React.createElement('div', {
      style:{ width:360, flexShrink:0, background:'white', borderRight:`1px solid ${C.border}`, overflowX:'hidden', overflowY:'auto', display:'flex', flexDirection:'column' }
    },
      // Tabs
      React.createElement('div', { style:{ display:'flex', borderBottom:`1px solid ${C.border}` } },
        // A template has no project details to fill in, so its second tab
        // carries just the allowances — the one part of that panel that is
        // genuinely reusable scope.
        (templateMode ? [['sections','Sections'],['info','Allowances']] : [['sections','Sections'],['info','Project']]).map(([key,label]) =>
          React.createElement('button', {
            key, onClick:()=>setSideTab(key),
            style:{
              flex:1, fontFamily:"'Figtree',sans-serif", fontSize:9, letterSpacing:'0.15em', textTransform:'uppercase',
              fontWeight:500, background:'none', border:'none', cursor:'pointer', padding:'11px 0',
              color: sideTab===key ? C.slate : C.goldDark,
              borderBottom: sideTab===key ? `2px solid ${C.magnolia}` : '2px solid transparent',
              marginBottom:-1,
            }
          }, label)
        )
      ),
      sideTab === 'info'
        ? React.createElement('div', { style:{flex:1,overflow:'auto'} },
            // Project-only fields: identity, price, deposit, schedule, and the
            // uploaded plans. None of it belongs to a reusable template.
            !templateMode && React.createElement(ProjectInfo, { key:'info', info, onChange: setInfo, onChangeType: changeProjectType }),
            React.createElement(AllowancesPanel, { key:'allow', allowances, onChange: setAllowances }),
            React.createElement(AddOnsPanel, { key:'addons', addOns, onChange: setAddOns }),
            !templateMode && React.createElement(DesignDrawingsPanel, { key:'draw', drawings: designDrawings, onChange: setDesignDrawings })
          )
        : React.createElement('div', { style:{flex:1,overflow:'auto',padding:16} },
            // Stats
            React.createElement('div', { style:{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8, marginBottom:16 } },
              ...[[totalIncluded,'Scope Lines',C.magnolia],[totalExclusions,'Exclusions',C.goldDark]].map(([n,label,color])=>
                React.createElement('div', { key:label, style:{ background:C.bgLight, padding:'10px 12px', textAlign:'center' } },
                  React.createElement('div', { style:{ fontFamily:"'Cormorant Garamond',serif", fontSize:28, fontWeight:500, color, lineHeight:1 } }, n),
                  React.createElement('div', { style:{ fontFamily:"'Figtree',sans-serif", fontSize:8, letterSpacing:'0.1em', textTransform:'uppercase', color:C.goldDark, marginTop:4 } }, label)
                )
              )
            ),
            // Quick section list
            React.createElement('div', { style:{ fontFamily:"'Figtree',sans-serif", fontSize:9, letterSpacing:'0.15em', textTransform:'uppercase', color:C.goldDark, marginBottom:8, fontWeight:500 } }, 'Sections'),
            sections.map(s => {
              const n = s.items.filter(i=>i.included).length;
              return React.createElement('div', {
                key:s.id,
                style:{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'5px 0', cursor:'pointer', opacity: n > 0 ? 1 : 0.45 },
                onClick: () => { setSideTab('sections_main'); document.getElementById('section_'+s.id)?.scrollIntoView({behavior:'smooth', block:'start'}); }
              },
                React.createElement('span', { style:{ fontFamily:"'Figtree',sans-serif", fontSize:11, color:C.slate } }, s.title),
                n > 0 && React.createElement('span', { style:{ fontFamily:"'Figtree',sans-serif", fontSize:10, color:C.magnolia, fontWeight:500 } }, n)
              );
            })
          )
    ),

    // Main area — scope library
    React.createElement('div', { style:{ flex:1, overflow:'auto', display:'flex', flexDirection:'column' } },
      // Search bar
      React.createElement('div', { style:{ padding:'12px 16px', background:'white', borderBottom:`1px solid ${C.border}`, display:'flex', gap:8, flexShrink:0 } },
        React.createElement('input', {
          placeholder:'Search scope lines…',
          value: searchQ,
          onChange: e => setSearchQ(e.target.value),
          style:{ flex:1, fontFamily:"'Figtree',sans-serif", fontSize:12, border:`1px solid ${C.border}`, padding:'7px 12px', color:C.slate, outline:'none', background:'white' }
        }),
        searchQ && React.createElement('button', {
          onClick:()=>setSearchQ(''),
          style:{ background:'none', border:`1px solid ${C.border}`, padding:'6px 10px', cursor:'pointer', color:C.goldDark, fontSize:12 }
        }, '✕')
      ),
      // Section accordions
      React.createElement('div', { style:{ padding:'8px 0', flex:1 } },
        filteredSections.map((s, idx) =>
          React.createElement('div', {
            key:s.id, id:'section_'+s.id,
            draggable: true,
            onDragStart: () => onDragStart(s.id),
            onDragEnter: () => onDragEnter(s.id),
            onDragEnd: onDragEnd,
            onDragOver: e => e.preventDefault(),
            style: { outline: dragOver === s.id ? `2px solid ${C.magnolia}` : 'none', transition:'outline 0.1s' }
          },
            React.createElement(SectionAccordion, {
              section: s,
              onUpdateItems: updateSectionItems,
              onToggleAll: toggleAll,
              onMoveUp: () => moveSection(s.id, -1),
              onMoveDown: () => moveSection(s.id, 1),
              onDelete: () => deleteSection(s.id),
              isFirst: idx === 0,
              isLast: idx === filteredSections.length - 1,
              dragHandleProps: {
                draggable: true,
                onDragStart: e => { e.stopPropagation(); onDragStart(s.id); },
              },
              onAddToLibrary: typeof cpAddToLibrary === 'function' ? async (sectionId, sectionTitle, text) => {
                const hardcodedItems = getHardcodedItems(sectionId);
                const { error, alreadyExists } = await cpAddToLibrary(sectionId, sectionTitle, text, hardcodedItems);
                if (alreadyExists) alert('Already in library.');
                else if (error) alert('Failed to add to library.');
                else alert('"' + text.substring(0, 60) + (text.length > 60 ? '…' : '') + '" added to master library.');
              } : null,
              onSaveToLibrary: typeof cpUpdateLibraryItem === 'function' ? async (sectionId, sectionTitle, libraryText, newText) => {
                const hardcodedItems = getHardcodedItems(sectionId);
                const { error, alreadyExists } = await cpUpdateLibraryItem(sectionId, sectionTitle, libraryText, newText, hardcodedItems);
                if (error) { alert('Failed to save to library.'); return; }
                if (alreadyExists) { alert('Already in library.'); return; }
                // Sync local libraryText so further edits on this item replace
                // (not duplicate) the library entry.
                setSections(sects => sects.map(sec => {
                  if (sec.id !== sectionId) return sec;
                  return {
                    ...sec,
                    items: sec.items.map(it =>
                      it.libraryText === libraryText ? { ...it, libraryText: newText } : it
                    ),
                  };
                }));
                const snippet = newText.length > 60 ? newText.substring(0, 60) + '…' : newText;
                alert('"' + snippet + '" saved to master library.');
              } : null,
              onSaveSectionToLibrary: typeof cpSaveSectionToLibrary === 'function' ? async (sectionId, sectionTitle, items) => {
                const { error } = await cpSaveSectionToLibrary(sectionId, sectionTitle, items);
                if (error) { alert('Failed to save section to library.'); return; }
                // Mark each item's libraryText so subsequent per-line edits
                // replace (not duplicate) the library entry.
                setSections(sects => sects.map(sec => {
                  if (sec.id !== sectionId) return sec;
                  return {
                    ...sec,
                    items: sec.items.map(it => ({ ...it, libraryText: it.text })),
                  };
                }));
                alert('Section "' + sectionTitle + '" saved to master library.');
              } : null,
            })
          )
        ),
        // Exclusions at bottom
        React.createElement('div', { style:{marginTop:2} },
          React.createElement(ExclusionsPanel, { exclusions, onUpdate:setExclusions })
        ),
        // Add new section
        React.createElement('div', { style:{ padding:'12px 16px', borderTop:`1px solid ${C.border}`, marginTop:4 } },
          React.createElement('div', { style:{ display:'flex', gap:8 } },
            React.createElement('input', {
              placeholder: 'New section name…',
              value: addingSectionName,
              onChange: e => setAddingSectionName(e.target.value),
              onKeyDown: e => { if (e.key==='Enter' && addingSectionName.trim()) { addSection(addingSectionName.trim()); setAddingSectionName(''); } },
              style: { flex:1, fontFamily:"'Figtree',sans-serif", fontSize:12, border:`1px solid ${C.border}`, padding:'7px 10px', color:C.slate, outline:'none', background:'white' }
            }),
            React.createElement('button', {
              onClick: () => { if (addingSectionName.trim()) { addSection(addingSectionName.trim()); setAddingSectionName(''); } },
              style: btnSmall(C.slate, 'white')
            }, '+ Section')
          )
        )
      )
    )
  ));

  // ── PREVIEW VIEW ──
  const previewView = React.createElement('div', {
    style:{ flex:1, overflow:'auto', background:'#ccc9c4', padding:'32px' }
  },
    React.createElement('div', { style:{ maxWidth:816, margin:'0 auto', background:'white', boxShadow:'0 4px 32px rgba(0,0,0,0.18)' } },
      React.createElement(ScopeDocument, { info, sections, exclusions, allowances, addOns, designDrawings })
    )
  );

  return React.createElement('div', { id:'builder-shell', style:{ height:'100vh', display:'flex', flexDirection:'column', overflow:'hidden' } },
    topBar,
    tab === 'build' ? buildView : previewView
  );
}

</script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
